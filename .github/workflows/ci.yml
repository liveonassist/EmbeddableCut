# SPDX-License-Identifier: MIT
#
# CI for EmbeddableCut. Every job runs inside the flake's dev shell, so CI uses
# the same Node, Chrome and ffmpeg as `nix develop`.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly soak for the preview-sync stress job, which catches ordering
    # flakes introduced through indirect dependencies.
    - cron: '0 7 * * *'

jobs:
  architecture:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v24
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: nix develop --command npm ci --ignore-scripts
      - run: nix develop --command just check tasks
      - run: nix develop --command just check architecture
      - run: nix develop --command sh -c 'node scripts/checks/overlay.mjs report-feature-edges.mjs --json > feature-edges-report.json'
      - uses: actions/upload-artifact@v4
        with:
          name: feature-edges-report
          path: feature-edges-report.json

  engine:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v24
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: nix develop --command npm ci --ignore-scripts
      - run: nix develop --command sh -c 'cd engine && npm run check && npm run test:coverage'
      - run: nix develop --command sh -c 'cd sdk && npm run check && npx vp test run'
      - run: nix develop --command sh -c 'cd ui && npm run check && npx vp test run'

  web:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v24
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: nix develop --command npm ci --ignore-scripts
      - run: nix develop --command sh -c 'cd web && npm run check && npm run build'
      # The portable Node, Chrome, edit-operation and generated-media suites
      # reuse the build above and never need WebGPU.
      - run: nix develop --command sh -c 'cd render && npm run test:portable'

  nix:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v24
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check -L

  # Re-runs the preview-sync suite from cold to surface ordering and
  # stale-render flakes in the fast-scrub state machine: nightly in full, and on
  # pull requests that touch preview code.
  preview-sync-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether to run
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "runs=10" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD \
            | grep -qE '^((engine|ui)/src/features/preview/|ui/scripts/preview-sync-stress\.mjs$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "runs=5" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: cachix/install-nix-action@v24
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.gate.outputs.run == 'true'
        run: nix develop --command npm ci --ignore-scripts
      - if: steps.gate.outputs.run == 'true'
        run: nix develop --command sh -c 'cd ui && npm run test:preview-sync:stress -- --runs ${{ steps.gate.outputs.runs }}'
